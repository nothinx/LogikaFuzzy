paragraph=Aturan ditulis jika(DINGIN).dan(KERING).maka(PELAN). Himpunan segitiga dan trapesium, operator DAN (min) dan ATAU (max), defuzzifikasi centroid dengan resolusi yang bisa diatur, dan Sugeno orde-0. Derajat keanggotaan dan kekuatan tiap aturan bisa dibaca untuk dicocokkan dengan hitungan manual atau MATLAB. Tanpa alokasi dinamis: kapasitas tetap lewat template. English: fuzzy logic, fuzzy inference, Mamdani, Sugeno, centroid, membership function, no dynamic allocation.
